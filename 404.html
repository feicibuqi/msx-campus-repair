<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>码上修 · 正在跳转</title>
<style>
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#F4F2EF;color:#1F1B18;display:flex;align-items:center;
       justify-content:center;min-height:100vh;text-align:center;padding:24px}
  .box{max-width:420px}
  .mark{width:54px;height:54px;border-radius:16px;background:#8C1C13;color:#fff;
        display:flex;align-items:center;justify-content:center;font-size:26px;
        font-weight:800;margin:0 auto 16px}
  h1{font-size:18px;margin:0 0 8px}
  p{font-size:14px;color:#7A716A;line-height:1.7;margin:0 0 18px}
  a{display:inline-block;background:#8C1C13;color:#fff;text-decoration:none;
    padding:12px 26px;border-radius:12px;font-size:15px;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <div class="mark">修</div>
  <h1>正在进入「码上修」</h1>
  <p>如果没有自动跳转，请点击下面的按钮。<br>正常使用时请扫描楼层里张贴的二维码，位置会自动填好。</p>
  <a id="go" href="./index.html">进入报修页面</a>
</div>
<script>
  // 保留查询串与 hash，避免扫码器丢失参数
  location.replace('./index.html' + location.search + location.hash);
</script>
</body>
</html>
